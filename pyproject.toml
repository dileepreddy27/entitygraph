[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entitygraph"
version = "0.1.0"
description = "Auditable document entity resolution and knowledge graph pipeline"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
model = ["transformers>=4.44,<5", "torch>=2.4,<3", "tokenizers>=0.19,<1"]
graph = ["neo4j>=5.24,<6"]
spark = ["pyspark>=3.5,<4"]
test = ["pytest>=8,<9"]

[project.scripts]
entitygraph = "entitygraph.cli:main"

[tool.setuptools.packages.find]
include = ["entitygraph*"]
